<!doctype html><html lang="en"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/><title>Door Atelier</title>  <script type="module" crossorigin src="./assets/game.js"></script>
  <link rel="stylesheet" crossorigin href="./assets/index.css">
</head><body><main><header><div><p class="eyebrow">MINIATURE MYSTERIES</p><h1>Door Atelier</h1></div><div class="header-controls"><button id="sound" aria-label="Toggle sound">♪ Sound</button><button id="pause" aria-label="Pause animation">Ⅱ Pause</button></div></header><section class="scene-bar"><button id="previous" class="arrow" aria-label="Previous door">‹</button><div><p id="scene-count">DOOR 1 / 3</p><h2 id="scene-name">Brass Garden Door</h2></div><button id="next" class="arrow" aria-label="Next door">›</button></section><section class="stage-wrap"><canvas id="stage" aria-label="Interactive 3D miniature door scene"></canvas><div class="hint">Drag to orbit · tap glowing objects to inspect</div></section><section class="control-row"><button id="nudge">✦ Nudge</button><button id="reset">↻ Reset this door</button><label><input id="motion" type="checkbox"/> Reduced motion</label></section><section class="tray"><div class="inventory"><p>INVENTORY</p><div id="inventory-items" role="list"></div></div><div class="readout"><p id="status" aria-live="polite">Inspect the brass garden.</p><p id="objective">Find what makes this little door open.</p></div></section></main></body></html>
